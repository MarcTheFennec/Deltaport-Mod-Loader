name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    container:
      image: koalaman/shellcheck-alpine:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning \
            port.sh update.sh deps.sh modloader.sh DELTARUNE.sh lib.sh

  build:
    name: Package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            TAGGED="true"
          else
            VER="dev-$(git rev-parse --short HEAD)"
            TAGGED="false"
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "tagged=${TAGGED}" >> "${GITHUB_OUTPUT}"

      - name: Package release archives
        run: |
          set -e
          NAME="deltaport-mod-loader-${{ steps.version.outputs.version }}"
          # Build the archives OUTSIDE the source tree - writing them into
          # the directory being archived makes tar fail with
          # "file changed as we read it".
          BUILD_DIR="$(mktemp -d)"
          tar --exclude='.git' -czf "${BUILD_DIR}/${NAME}.tar.gz" -C . .
          tar --exclude='.git' -cJf "${BUILD_DIR}/${NAME}.tar.xz" -C . .
          mv "${BUILD_DIR}/${NAME}".tar.* .
          rm -rf "$BUILD_DIR"
          sha256sum "${NAME}.tar.gz" "${NAME}.tar.xz" > SHA256SUMS
          cat SHA256SUMS

      - name: Sanity check archive contents
        run: |
          set -e
          NAME="deltaport-mod-loader-${{ steps.version.outputs.version }}"
          LISTING="$(tar -tzf "${NAME}.tar.gz")"
          for required in ./port.sh ./update.sh ./deps.sh ./modloader.sh ./DELTARUNE.sh ./lib.sh ./launcher.sh ./mod-index.json ./deltarune ./icon.png ./files/options.ini ./files/patches/v0.0.253/00-chapterselect.hpatch ./files/patches/nxrune/00-chapterselect.hpatch; do
            if ! grep -qx "${required}" <<< "${LISTING}"; then
              echo "ERROR: required entry missing from archive: ${required}"
              exit 1
            fi
          done
          echo "Archive contents look good."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deltaport-mod-loader-${{ steps.version.outputs.version }}
          path: |
            deltaport-mod-loader-*.tar.gz
            deltaport-mod-loader-*.tar.xz
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.tagged == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deltaport-mod-loader-*.tar.gz
            deltaport-mod-loader-*.tar.xz
            SHA256SUMS
          body: |
            deltaport (mod loader edition) - unofficial DELTARUNE Linux port.

            * Your original game files are NEVER modified - the port is
              installed in `~/.local/share/DELTARUNE/deltaport`.
            * Built-in Deltarune mod loader (`mods/` folder: `.hpatch` deltas
              and full-file mods, applied automatically on launch).
            * Optional NXRUNE console borders mod (`./port.sh nxrune`).

            **Install:** extract, then run `./port.sh` and follow the prompts.

            Supported game versions: 0.0.247, 0.0.250, 0.0.253.

          draft: false
          prerelease: false
